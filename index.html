<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube MP3 Downloader</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      padding: 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    p.subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input, select {
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    button {
      background-color: var(--primary);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
      margin-top: 8px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 16px;
      font-size: 0.875rem;
      text-align: center;
      min-height: 20px;
    }

    .status-msg.error {
      color: #f87171;
    }

    .status-msg.success {
      color: #4ade80;
    }

    .track-list {
      margin-top: 20px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
    }

    .track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.875rem;
    }

    .track-info {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      margin-right: 12px;
    }

    .track-title {
      font-weight: 600;
    }

    .track-channel {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .btn-download-sm {
      background-color: var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      font-size: 0.75rem;
      width: auto;
      margin-top: 0;
    }

    .btn-download-sm:hover {
      background-color: var(--primary);
      color: #000;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>YouTube MP3 Downloader</h1>
    <p class="subtitle">Extract audio and download tracks directly to MP3</p>

    <div class="form-group">
      <label for="videoUrl">YouTube URL</label>
      <input 
        type="text" 
        id="videoUrl" 
        placeholder="https://www.youtube.com/watch?v=k9DMXBFHEH4"
        value="https://www.youtube.com/watch?v=k9DMXBFHEH4"
      >
    </div>

    <div class="row">
      <div class="form-group">
        <label for="bitrate">Audio Quality</label>
        <select id="bitrate">
          <option value="128">128 kbps (Fast)</option>
          <option value="192" selected>192 kbps (Standard)</option>
          <option value="256">256 kbps (High)</option>
          <option value="320">320 kbps (Best)</option>
        </select>
      </div>
    </div>

    <button id="fetchBtn" onclick="handleFetch()">Fetch Details</button>
    <button id="downloadBtn" onclick="handleDirectDownload()" style="margin-top: 8px; background-color: var(--border); color: var(--text-main);">Download Direct MP3</button>

    <div id="status" class="status-msg"></div>

    <div id="trackList" class="track-list" style="display: none;"></div>
  </div>

  <script>
    const API_BASE = 'http://localhost:4000/api';

    async function handleFetch() {
      const url = document.getElementById('videoUrl').value.trim();
      const statusEl = document.getElementById('status');
      const trackListEl = document.getElementById('trackList');
      const fetchBtn = document.getElementById('fetchBtn');

      if (!url) {
        showStatus('Please enter a valid YouTube URL', 'error');
        return;
      }

      showStatus('Fetching video details...', '');
      fetchBtn.disabled = true;
      trackListEl.style.display = 'none';
      trackListEl.innerHTML = '';

      try {
        const res = await fetch(`${API_BASE}/playlist?url=${encodeURIComponent(url)}`);
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Failed to fetch video information');

        showStatus(`Found ${data.tracks.length} track(s)`, 'success');
        renderTracks(data.tracks);
      } catch (err) {
        showStatus(err.message, 'error');
      } finally {
        fetchBtn.disabled = false;
      }
    }

    function renderTracks(tracks) {
      const trackListEl = document.getElementById('trackList');
      trackListEl.style.display = 'flex';

      tracks.forEach(track => {
        const item = document.createElement('div');
        item.className = 'track-item';
        item.innerHTML = `
          <div class="track-info">
            <div class="track-title">${escapeHtml(track.title)}</div>
            <div class="track-channel">${escapeHtml(track.channel)} • ${track.duration}</div>
          </div>
          <button class="btn-download-sm" onclick="downloadAudio('${escapeHtml(track.url)}', '${escapeHtml(track.title)}')">Save MP3</button>
        `;
        trackListEl.appendChild(item);
      });
    }

    function handleDirectDownload() {
      const url = document.getElementById('videoUrl').value.trim();
      if (!url) {
        showStatus('Please enter a YouTube URL', 'error');
        return;
      }
      downloadAudio(url, 'audio');
    }

    function downloadAudio(videoUrl, title) {
      const quality = document.getElementById('bitrate').value;
      showStatus('Starting MP3 conversion stream...', 'success');

      const downloadEndpoint = `${API_BASE}/download-mp3?url=${encodeURIComponent(videoUrl)}&quality=${quality}&title=${encodeURIComponent(title)}`;
      window.location.href = downloadEndpoint;
    }

    function showStatus(text, type) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = text;
      statusEl.className = `status-msg ${type}`;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
